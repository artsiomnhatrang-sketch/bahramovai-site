<style>

  body { background:#000; color:#a3a3a3; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
         display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; padding:24px; text-align:center; }

<body>
  <p>Страница переехала. Пакет продвижения СКАЙНЕТ - <a href="https://bahramovai.com/uslugi/prodvizhenie-instagram.html">на странице услуги</a>.</p>
<!-- cookie-bar:start -->
<script>
(function () {
  var K = 'bhck';
  try { if (localStorage.getItem(K)) return; } catch (e) {}
  try { if (document.cookie.indexOf(K + '=1') > -1) return; } catch (e) {}
  var root = document.documentElement, bar, done = false;
  function fit() {
    if (!bar) return;
    if (window.matchMedia('(max-width:768px)').matches)
      root.style.setProperty('--ck-h', Math.max(0, window.innerHeight - bar.getBoundingClientRect().top) + 'px');
    else root.style.removeProperty('--ck-h');
    window.dispatchEvent(new Event('scroll'));
  }
  function ok() {
    try { localStorage.setItem(K, '1'); } catch (e) {}
    try { document.cookie = K + '=1; max-age=31536000; path=/; SameSite=Lax'; } catch (e) {}
    bar.remove(); bar = null;
    root.classList.remove('ck-open'); root.style.removeProperty('--ck-h');
    window.removeEventListener('resize', fit);
    window.dispatchEvent(new Event('scroll'));
  }
  function show() {
    if (done || window.scrollY < 150) return;
    done = true;
    window.removeEventListener('scroll', show);
    var st = document.createElement('style');
    st.textContent = '.ck{position:fixed;left:16px;bottom:16px;z-index:999;box-sizing:border-box;max-width:440px;display:flex;align-items:center;gap:14px;padding:12px 12px 12px 16px;background:rgba(14,14,14,.96);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.12);border-radius:16px;font-family:Inter,"Inter Fallback R","Inter Fallback A",system-ui,-apple-system,sans-serif;font-size:13.5px;line-height:1.45;color:#cfcfcf;text-align:left}'
      + '.ck p{margin:0;flex:1}.ck a{color:#f4672a;text-decoration:underline}'
      + '.ck button{flex:none;height:38px;padding:0 20px;border:0;border-radius:100px;background:#f4672a;color:#000;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer}'
      + '.ck button:hover{background:#ff7d45}.ck button:focus-visible{outline:2px solid #fff;outline-offset:2px}'
      + '@media (max-width:768px){.ck{left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom,0px));max-width:none;padding:10px 10px 10px 14px;font-size:13px}'
      + 'html.ck-open .conv-sticky.on,html.ck-open .mobile-cta.visible{bottom:var(--ck-h,0px)}}';
    document.head.appendChild(st);
    bar = document.createElement('div');
    bar.className = 'ck';
    bar.setAttribute('role', 'region');
    bar.setAttribute('aria-label', 'Файлы cookie');
    bar.innerHTML = '<p>Сайт использует cookie и Яндекс Метрику для статистики. <a href="/privacy.html#cookie">Подробнее</a></p><button type="button">Принять</button>';
    bar.querySelector('button').addEventListener('click', ok);
    document.body.appendChild(bar);
    root.classList.add('ck-open');
    fit();
    window.addEventListener('resize', fit);
  }
  function arm() { window.addEventListener('scroll', show, { passive: true }); show(); }
  if (document.readyState === 'complete') arm(); else window.addEventListener('load', arm);
})();
</script>
<!-- cookie-bar:end -->
</body>
</html>
